version: 2.1

orbs:
  php: circleci/php@1.1

jobs:
  build-and-test:
    parameters:
      php-version:
        type: string
    docker:
      - image: cimg/php:<< parameters.php-version >>
        environment:
          CI_ENVIRONMENT: testing
      - image: cimg/mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ospos
          MYSQL_USER: ospos
          MYSQL_PASSWORD: ospos

    steps:
      - checkout

      # Install required PHP extensions
      - run:
          name: Install PHP Extensions
          command: |
            sudo apt-get update
            sudo apt-get install -y php-mysql php-intl php-curl php-xml php-mbstring

      # Update composer to latest version
      - run:
          name: Update Composer
          command: |
            sudo composer self-update

      # Install dependencies with --ignore-platform-reqs for PHP 8.1
      - run:
          name: Install Dependencies
          command: |
            if [ "<< parameters.php-version >>" = "8.1" ]; then
              composer install --no-interaction --prefer-dist --ignore-platform-reqs
            else
              composer install --no-interaction --prefer-dist
            fi

      - run:
          name: Setup Environment Variables
          command: |
            if [ -f ".env.example" ]; then
              cp .env.example .env
            elif [ -f "env.example" ]; then
              cp env.example .env
            else
              echo "CI_ENVIRONMENT = testing" > .env
              echo "database.default.hostname = 127.0.0.1" >> .env
              echo "database.default.database = ospos" >> .env
              echo "database.default.username = ospos" >> .env
              echo "database.default.password = ospos" >> .env
            fi
            sed -i 's/CI_ENVIRONMENT = production/CI_ENVIRONMENT = testing/' .env
            sed -i 's/database.default.hostname = .*/database.default.hostname = 127.0.0.1/' .env
            sed -i 's/database.default.database = .*/database.default.database = ospos/' .env
            sed -i 's/database.default.username = .*/database.default.username = ospos/' .env
            sed -i 's/database.default.password = .*/database.default.password = ospos/' .env

      - run:
          name: Setup CodeIgniter
          command: |
            mkdir -p writable/cache
            mkdir -p writable/logs
            mkdir -p writable/session
            chmod -R 777 writable
            chmod +x spark

      - run:
          name: Wait for MySQL
          command: |
            dockerize -wait tcp://localhost:3306 -timeout 1m

      - run:
          name: Run Database Migrations
          command: |
            php spark migrate --all

      - run:
          name: Run Tests
          command: |
            ./vendor/bin/phpunit

      - run:
          name: Run PHP CodeSniffer
          command: |
            ./vendor/bin/phpcs --standard=PSR12 app/

workflows:
  test-deploy:
    jobs:
      - build-and-test:
          matrix:
            parameters:
              php-version: ["8.1", "8.2"] 